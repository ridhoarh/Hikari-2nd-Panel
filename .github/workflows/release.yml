name: release

on:
  push:
    tags: ['v*']

# Tanpa ini, GITHUB_TOKEN-nya cuma punya izin baca, dan upload ke
# Releases gagal dengan "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bun run build
      - run: bun run typecheck
      - run: bun test

      # Tarball harus self-contained: install.sh ngejalanin TypeScript source
      # langsung, jadi node_modules ikut dibungkus.
      #
      # Daftar file di bawah HARUS ada semua. Dulu `bunfig.toml` ikut
      # didaftarin padahal file itu nggak pernah dibikin, dan tar-nya gagal
      # dengan "Cannot stat" — ketahuan cuma karena rilis-nya beneran
      # dijalanin.
      - name: Cek file yang mau dibungkus ada semua
        run: |
          for f in apps docs package.json tsconfig.json install.sh README.md; do
            if [ ! -e "$f" ]; then
              echo "::error::$f nggak ada, tarball-nya bakal gagal"
              exit 1
            fi
          done

      - run: bun install --production
      - run: tar -czf hikari.tar.gz apps docs package.json tsconfig.json node_modules install.sh README.md

      - name: Verifikasi isi tarball
        run: |
          echo "=== isi tarball ==="
          tar -tzf hikari.tar.gz | head -20
          # `docs/` ikut dicek: dulu dia kelewat dari daftar tar, jadi panduan
          # yang dimaksud buat pengguna nggak pernah sampai ke instalasinya —
          # dan nggak ada yang sadar sampai diperiksa manual di VPS.
          for f in apps/server/src/index.ts apps/web/dist/index.html install.sh package.json docs/AGENTS.md docs/ARCHITECTURE.md; do
            if ! tar -tzf hikari.tar.gz | grep -qx "$f"; then
              echo "::error::$f nggak ada di dalam tarball"
              exit 1
            fi
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: hikari.tar.gz
          generate_release_notes: true
